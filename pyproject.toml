[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-motion-lab"
version = "1.0.0"
description = "Local desktop face tracking and movement analysis workbench"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shivam Singh / MathTech"}]
dependencies = [
  "numpy>=1.26,<3", "scipy>=1.11,<2", "opencv-python-headless>=4.10,<5",
  "PySide6>=6.7,<7", "pyqtgraph>=0.13.7,<0.15", "PyYAML>=6,<7",
  "matplotlib>=3.8,<4", "psutil>=5.9,<8"
]

[project.optional-dependencies]
landmarks = ["mediapipe>=0.10.20,<0.11"]
research = ["jupyterlab>=4,<5", "plotly>=5,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9"]
onnx = ["onnxruntime>=1.18,<2"]
torch = ["torch>=2.3,<3"]

[project.scripts]
face-motion-lab = "face_motion_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
